# 各阶段自动化测试：H2 内存库（MySQL 模式），零外部依赖
spring:
  datasource:
    url: jdbc:h2:mem:fams;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  sql:
    init:
      mode: always
      encoding: utf-8
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/seed.sql
      continue-on-error: false
      separator: ;

fams:
  security:
    bootstrap-password: Fams@2026
    jwt-secret: ZmFtc0B0ZXN0LXNlY3JldC1rZXktZm9yLXVuaXQtdGVzdHMtb25seQ==
    jwt-expire-minutes: 60
    password-max-age-days: 90
    max-failed-attempts: 5
    lock-minutes: 30
    permit-all:
      - /health
      - /auth/login
      - /actuator/health
      - /auth/liuxun/**
  cors:
    allowed-origins: http://localhost:5174
  # 柳讯对接：测试固定 mock，零外部依赖
  liuxun:
    mock: true
    client-id: '100000050'
    app-id: 'f5f2b942-4044-4791-8424-53b82bc99758'
    redirect-uri: http://192.168.60.66/oauth/callback

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: warn
    com.fams: info
