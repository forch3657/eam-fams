server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  # 契约约定前端 VITE_API_BASE_URL = http://localhost:8080/api。
  # 统一在各 Controller 的 @RequestMapping 上显式声明 /api 前缀（而非 context-path），
  # 这样单元测试与真实部署的 URL 完全一致，避免 MockMvc 语境差异。

spring:
  profiles:
    # 本地默认零依赖跑 H2；接入真实 MySQL 时改为 dev（SPRING_PROFILES_ACTIVE=dev）
    active: ${SPRING_PROFILES_ACTIVE:h2}
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'null'
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: assign_id

fams:
  security:
    jwt-secret: ${JWT_SECRET:ZmFtc0BkZXZlbG9wbWVudC1zZWNyZXQta2V5LWRvLW5vdC11c2UtaW4tcHJvZA==}
    # S-03：access token 有效期收敛到 30 分钟（原 480），降低被盗 token 的重放窗口
    jwt-expire-minutes: ${JWT_EXPIRE_MINUTES:30}
    # 部门规范：密码复杂度 + 定期修改
    password-min-length: 8
    password-max-age-days: ${PASSWORD_MAX_AGE_DAYS:90}
    # 部门规范：登录失败 5 次锁定 30 分钟
    max-failed-attempts: 5
    lock-minutes: 30
    permit-all:
      - /health
      - /version
      - /auth/login
      # D3 探活端点：nginx/监控无需登录即可读取健康状态（仅 health，指标仍需认证）
      - /actuator/health
      # 柳讯免登：回调换 token 时尚无本地 JWT（SecurityConfig 会自动前置 /api）
      - /auth/liuxun/**
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174}
  # 柳讯开放能力平台对接。默认 mock=true，联调时按 profile 覆盖为 false。
  liuxun:
    mock: ${LIUXUN_MOCK:true}
    base-url: ${LIUXUN_BASE_URL:http://172.19.19.16:31460}
    client-id: ${LIUXUN_CLIENT_ID:}
    client-secret: ${LIUXUN_CLIENT_SECRET:}
    app-id: ${LIUXUN_APP_ID:}
    redirect-uri: ${LIUXUN_REDIRECT_URI:http://192.168.60.66/oauth/callback}
    connect-timeout: 5000
    read-timeout: 10000
    mock-user-phone: ${LIUXUN_MOCK_PHONE:13625070487}
    mock-user-id: ${LIUXUN_MOCK_USER_ID:157}
    mock-user-name: ${LIUXUN_MOCK_NAME:测试用户}
    default-role-code: ${LIUXUN_DEFAULT_ROLE:ROLE_USER}
    default-position: ${LIUXUN_DEFAULT_POSITION:职员}
    default-company-id: ${LIUXUN_DEFAULT_COMPANY:C1}
    default-dept-id: ${LIUXUN_DEFAULT_DEPT:D1}

# D3 可观测性：actuator 指标与探活
management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: fams
