server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  # 契约约定前端 VITE_API_BASE_URL = http://localhost:8080/api。
  # 统一在各 Controller 的 @RequestMapping 上显式声明 /api 前缀（而非 context-path），
  # 这样单元测试与真实部署的 URL 完全一致，避免 MockMvc 语境差异。

spring:
  profiles:
    # 本地默认零依赖跑 H2；接入真实 MySQL 时改为 dev（SPRING_PROFILES_ACTIVE=dev）
    active: ${SPRING_PROFILES_ACTIVE:h2}
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'null'
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: assign_id

fams:
  security:
    jwt-secret: ${JWT_SECRET:ZmFtc0BkZXZlbG9wbWVudC1zZWNyZXQta2V5LWRvLW5vdC11c2UtaW4tcHJvZA==}
    jwt-expire-minutes: ${JWT_EXPIRE_MINUTES:480}
    # 部门规范：密码复杂度 + 定期修改
    password-min-length: 8
    password-max-age-days: ${PASSWORD_MAX_AGE_DAYS:90}
    # 部门规范：登录失败 5 次锁定 30 分钟
    max-failed-attempts: 5
    lock-minutes: 30
    permit-all:
      - /health
      - /auth/login
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174}
