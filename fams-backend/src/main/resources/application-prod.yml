# 生产 profile：本机企业级部署形态（配合 nginx HTTPS 反代 + 前端静态化）。
# 用法：SPRING_PROFILES_ACTIVE=prod java -jar fams-backend.jar
#       （start-prod 脚本已封装）
server:
  # 生产只监听回环地址：外部一律经 nginx（80/443）访问，
  # 避免局域网可直连 8080 明文 HTTP 绕过网关与 TLS。
  address: ${SERVER_ADDRESS:127.0.0.1}
  # 信任 nginx 传入的 X-Forwarded-Proto/For：
  # 否则 HTTPS 入口进来的请求在后端看来是 http，浏览器带 Origin: https://<IP> 时
  # 会被判成跨域并与 allowed-origins 比对失败，登录直接 403 Invalid CORS request。
  forward-headers-strategy: native

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/fams?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:fams}
    password: ${DB_PASSWORD:FamsDb@2026!}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never

fams:
  security:
    # 生产部署务必通过环境变量 JWT_SECRET 注入强密钥；此处默认值仅用于本机演示，部署时覆盖。
    # 注意：HS256 要求密钥 >= 256 bits（>= 32 个 ASCII 字符），否则启动报 WeakKeyException。
    jwt-secret: ${JWT_SECRET}
    jwt-expire-minutes: ${JWT_EXPIRE_MINUTES:480}
    permit-all:
      - /health
      - /auth/login
  cors:
    # 前端由 nginx 在 https://localhost 托管，/api 反代到本服务，同源即可；
    # 如需跨域再放开，用环境变量 CORS_ALLOWED_ORIGINS 覆盖
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://localhost}

logging:
  level:
    root: info
    com.fams: info
