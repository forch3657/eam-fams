worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # HTTP -> HTTPS 跳转
    server {
        listen       80;
        server_name  localhost;
        return 301 https://$host$request_uri;
    }

    # HTTPS 主服务：前端静态 + 后端 API 反代
    server {
        listen       443 ssl;
        server_name  localhost;

        ssl_certificate      f:/work/EAM-FAMS/deploy/certs/localhost.crt;
        ssl_certificate_key  f:/work/EAM-FAMS/deploy/certs/localhost.key;
        ssl_protocols        TLSv1.2 TLSv1.3;

        # 前端构建产物（npm run build 输出）
        root   f:/work/EAM-FAMS/fams-frontend/dist;
        index  index.html;

        # SPA 路由回退
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 后端 API 反代（与前端同源，免 CORS）
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
