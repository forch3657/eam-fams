worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # HTTP 主入口：内网试用直接走 http://<本机IP>/，免自签证书告警。
    # 与 443 完全等价（前端静态 + API 反代），不再跳转 HTTPS。
    server {
        listen       80 default_server;
        server_name  _;

        root   f:/work/EAM-FAMS/fams-frontend/dist;
        index  index.html;

        # index.html 不缓存：重建后旧 HTML 会指向已删除的 hash 资源，导致整页白屏
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # 带 hash 的构建产物可长期缓存
        location /assets/ {
            expires 7d;
        }

        # SPA 路由回退
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 后端 API 反代（与前端同源，免 CORS）
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS 主服务：前端静态 + 后端 API 反代
    server {
        listen       443 ssl;
        server_name  localhost;

        ssl_certificate      f:/work/EAM-FAMS/deploy/certs/localhost.crt;
        ssl_certificate_key  f:/work/EAM-FAMS/deploy/certs/localhost.key;
        ssl_protocols        TLSv1.2 TLSv1.3;

        # 前端构建产物（npm run build 输出）
        root   f:/work/EAM-FAMS/fams-frontend/dist;
        index  index.html;

        # index.html 不缓存：重建后旧 HTML 会指向已删除的 hash 资源，导致整页白屏
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # 带 hash 的构建产物可长期缓存
        location /assets/ {
            expires 7d;
        }

        # SPA 路由回退
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 后端 API 反代（与前端同源，免 CORS）
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
