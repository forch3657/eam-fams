worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # D3 可观测性：访问日志含 traceId、响应耗时、上行流量；请求体上限防大包冲击
    log_format fams '$remote_addr - $remote_user [$time_local] "$request" '
                    'status=$status bytes=$body_bytes_sent rt=$request_time '
                    'trace=$http_x_trace_id ua="$http_user_agent"';
    access_log  logs/access.log  fams;
    client_max_body_size 20m;

    # D3 接口限流：按 IP 限制 API 请求速率，突发宽松以免影响正常使用与批量点测
    limit_req_zone $binary_remote_addr zone=fams_api:10m rate=30r/s;

    # HTTP 主入口：内网试用直接走 http://<本机IP>/，免自签证书告警。
    # 与 443 完全等价（前端静态 + API 反代），不再跳转 HTTPS。
    server {
        listen       80 default_server;
        server_name  _;

        root   f:/work/EAM-FAMS/fams-frontend/dist;
        index  index.html;

        # index.html 不缓存：重建后旧 HTML 会指向已删除的 hash 资源，导致整页白屏
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # 带 hash 的构建产物可长期缓存
        location /assets/ {
            expires 7d;
        }

        # SPA 路由回退
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 后端 API 反代（与前端同源，免 CORS）
        location /api/ {
            limit_req zone=fams_api burst=60 nodelay;
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 柳讯通讯录全量预置会逐条写入 2000+ 记录，单次请求可达数分钟
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
    }

    # HTTPS 主服务：手机连续扫码盘点入口（getUserMedia 需要安全上下文）
    # 证书由 scripts/gen-lan-cert.cjs 生成，SAN 含内网 IP / localhost / 127.0.0.1；
    # 手机须先安装并信任 fams-ca.crt（可从 http://<IP>/fams-ca.crt 下载）。
    # 80 端口保持明文入口供桌面点测，不做跳转。
    server {
        listen       443 ssl;
        server_name  _;

        ssl_certificate      f:/work/EAM-FAMS/deploy/certs/lan-chain.crt;
        ssl_certificate_key  f:/work/EAM-FAMS/deploy/certs/lan-server.key;
        ssl_protocols        TLSv1.2 TLSv1.3;

        # 前端构建产物（npm run build 输出）
        root   f:/work/EAM-FAMS/fams-frontend/dist;
        index  index.html;

        # index.html 不缓存：重建后旧 HTML 会指向已删除的 hash 资源，导致整页白屏
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # 带 hash 的构建产物可长期缓存
        location /assets/ {
            expires 7d;
        }

        # SPA 路由回退
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 后端 API 反代（与前端同源，免 CORS）
        location /api/ {
            limit_req zone=fams_api burst=60 nodelay;
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 柳讯通讯录全量预置会逐条写入 2000+ 记录，单次请求可达数分钟
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
    }
}
